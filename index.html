<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b16" />
    <meta name="description" content="看封面，猜播放量。打开即玩。" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>封面猜播放</title>
  </head>
  <body>
    <main class="game-shell" aria-live="polite">
      <header class="topbar">
        <a class="brand" href="/" aria-label="重新开始封面猜播放">
          <span class="brand-mark">▶</span>
          <span>封面猜播放</span>
        </a>
        <div class="scoreboard" aria-label="当前游戏成绩">
          <span><b id="streak">0</b> 连对</span>
          <span class="score-dot" aria-hidden="true"></span>
          <span><b id="score">0</b> 分</span>
        </div>
      </header>

      <section class="game" aria-labelledby="question-heading">
        <div class="round-info">
          <p id="question-heading">第 <span id="round">01</span> 题 <span class="separator">/</span> 只看封面</p>
          <p class="best">最高连对 <strong id="best">0</strong></p>
        </div>

        <article class="cover-card" id="cover-card">
          <div class="cover-image" id="cover-image" role="img" aria-label="本题视频封面"></div>
          <div class="cover-shine" aria-hidden="true"></div>
          <div class="cover-tag">播放量竞猜</div>
          <div class="reveal-card" id="reveal-card" aria-hidden="true">
            <p class="reveal-label">真实播放量</p>
            <p class="actual-count" id="actual-count">0</p>
            <p class="video-title" id="video-title"></p>
          </div>
        </article>

        <div class="prompt" id="prompt">正在准备题目…</div>
        <div class="choices" id="choices" aria-label="选择你猜测的播放量"></div>
        <section class="result" id="result" hidden>
          <div class="result-copy">
            <strong id="result-title"></strong>
            <span id="result-detail"></span>
          </div>
          <button class="next-button" id="next-button" type="button">下一题 <span>→</span></button>
        </section>
      </section>

      <footer>凭直觉猜，不用怕错。</footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
